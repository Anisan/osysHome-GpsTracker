<style>
  .widget-card.gps-tracker-map-widget-card {
    overflow: hidden !important;
    padding: 0 !important;
  }
  .gps-tracker-map-widget {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .gps-tracker-map-widget #gps_tracker_map_shared,
  .gps-tracker-map-widget #gps_tracker_map_shared .map-page,
  .gps-tracker-map-widget #gps_tracker_map_shared .map-container,
  .gps-tracker-map-widget #gps_tracker_map_shared .map-canvas,
  .gps-tracker-map-widget #gps_tracker_map_shared .leaflet-container {
    width: 100% !important;
    height: 100% !important;
    min-height: 0 !important;
  }
</style>

<script src="{{ config.ASSETS_ROOT }}/plugins/vue/axios.min.js"></script>
{% include "gpslogger_map_deps.html" %}
{% include "gpslogger_map_styles.html" %}

<div class="gps-tracker-map-widget">
  {% include "gpslogger_map_ui.html" %}
</div>

{% include "gpslogger_map_logic.html" %}
<script>
  (function() {
    function prepareCard(root) {
      const card = root.closest('.widget-card')
      if (card) {
        card.classList.add('gps-tracker-map-widget-card')
        card.style.setProperty('padding', '0', 'important')
        card.style.setProperty('overflow', 'hidden', 'important')
      }
      return card
    }

    function startMap() {
      const root = document.getElementById('gps_tracker_map_shared')
      if (!root || typeof window.initGpsTrackerMap !== 'function') return
      if (typeof L === 'undefined' || typeof axios === 'undefined') {
        setTimeout(startMap, 50)
        return
      }

      const card = prepareCard(root)
      const controller = window.initGpsTrackerMap(root)
      if (!controller) return

      function resizeMap() {
        controller.refreshSize()
      }

      Promise.resolve(controller.refreshData()).then(resizeMap)
      setTimeout(resizeMap, 50)
      setTimeout(resizeMap, 250)

      if (typeof ResizeObserver !== 'undefined' && !root._gpsTrackerResizeObserver) {
        const observer = new ResizeObserver(resizeMap)
        observer.observe(root)
        if (card) observer.observe(card)
        const gridItem = root.closest('.grid-stack-item')
        if (gridItem) observer.observe(gridItem)
        root._gpsTrackerResizeObserver = observer
      }
    }

    startMap()
  })()
</script>
