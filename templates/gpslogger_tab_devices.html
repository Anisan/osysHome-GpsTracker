<div class="tab-pane fade show active" id="devices" role="tabpanel" aria-labelledby="general-tab">
    <button type="button" class="btn btn-primary btn-sm" @click="fetchDevices()">
        <i class="fas me-2" :class="loading == 'devices' ? 'fa-spinner fa-spin' : 'fa-rotate'"></i>
        {{ _('Refresh')}}
    </button>
    <div class="table-responsive">
        <table class="table table-hover table-striped">
            <thead>
                <tr>
                    <th>{{ _('Title')}}</th>
                    <th>ID</th>
                    <th>{{ _('Lat')}}</th>
                    <th>{{ _('Lon')}}</th>
                    <th>{{ _('Linked object')}}</th>
                    <th>{{ _('Updated')}}</th>
                    <th>&nbsp;</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(item,key) in devices" :key="'devices_'+key">
                    <td><b>[[ item.title ]]</b></td>
                    <td>[[ item.device_id ]]</td>
                    <td>[[ item.lat ]]</td>
                    <td>[[ item.lon ]]</td>
                    <td>
                        <img v-if="item.avatar" :src="item.avatar" class="me-3" style="border-radius: 50% 50%;" :title="item.user" height="30px">
                        [[ item.linked_object ]]
                        <span v-if="item.color" class="badge" :style="{ 'background-color': item.color || '#ccc' }">Color</span>
                    </td>
                    <td>[[ item.updated ]]</td>
                    <td>
                        <a class="btn btn-success ms-2 ms-auto btn-sm" @click="editDevice(item)" title="{{ _('Edit')}}"><i class="fas fa-pencil-alt"></i></a>
                        <a class="btn btn-danger ms-2 ms-auto btn-sm" @click="delDevice(item.id)" title="{{ _('Delete')}}"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
