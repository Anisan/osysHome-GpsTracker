<div class="tab-pane fade" id="locations" role="tabpanel" aria-labelledby="general-tab">
    <button type="button" class="btn btn-primary btn-sm" @click="fetchLocations()">
        <i class="fas me-2" :class="loading == 'locations' ? 'fa-spinner fa-spin' : 'fa-rotate'"></i>
        {{ _('Refresh')}}
    </button>
    <button type="button" class="btn btn-success ms-2 btn-sm" @click="addLocation()" title="{{ _('Add')}}"><i class="fas fa-pencil-alt"></i>{{ _('Add')}}</button>
    <div class="table-responsive">
        <table class="table table-hover table-striped">
            <thead>
                <tr>
                    <th>{{ _('Title')}}</th>
                    <th>{{ _('Lat')}}</th>
                    <th>{{ _('Lon')}}</th>
                    <th>{{ _('Range')}}</th>
                    <th>{{ _('Is home')}}</th>
                    <th>&nbsp;</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(item,index) in locations" :key="'locations_'+index">
                    <td><b>[[ item.title ]]</b></td>
                    <td>[[ item.lat ]]</td>
                    <td>[[ item.lon ]]</td>
                    <td>[[ item.range ]]</td>
                    <td>[[ item.is_home ]]</td>
                    <td>
                        <a class="btn btn-success ms-2 ms-auto btn-sm" @click="editLocation(item)" title="{{ _('Edit')}}"><i class="fas fa-pencil-alt"></i></a>
                        <a class="btn btn-danger ms-2 ms-auto btn-sm" @click="delLocation(item.id)" title="{{ _('Delete')}}"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
